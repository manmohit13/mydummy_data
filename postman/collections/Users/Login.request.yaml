$kind: http-request
url: "{{localUrl}}/api/auth/local/"
method: POST
body:
  type: json
  content: "{\"identifier\":\"manmohit\",\"password\":\"developer@012\"}\r\n"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "if(pm.response.code === 200){\r

      \    const response = pm.response.json();\r

      \    if(response.token){\r

      \        pm.collectionVariables.set('token', response.token);\r

      \        console.log('Token saved:', response.token);\r

      \    }\r

      }"
    language: text/javascript
order: 4000
